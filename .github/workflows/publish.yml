name: Publicar calculadora
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Validar calculadora
        run: |
          node --check app.mjs
          node --check calc.mjs
          node --test tests/*.test.mjs
      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html style.css app.mjs calc.mjs manifest.webmanifest sw.js logo.webp icon-192.png icon-512.png .nojekyll _site/
      - name: Configurar publicação
        uses: actions/configure-pages@v5
      - name: Preparar pacote da publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
