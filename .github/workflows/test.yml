name: Verificar calculadora
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar cálculos
        run: node --test tests/calc.test.mjs
      - name: Conferir sintaxe
        run: |
          node --check app.mjs
          node --check calc.mjs
          node --check sw.js
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Simular uso em celular e computador
        run: node tests/browser.test.mjs
      - name: Salvar capturas de verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-do-sistema
          path: screenshots/
          if-no-files-found: ignore
