name: Verificar calculadora
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar cálculos
        run: node --test tests/*.test.mjs
      - name: Conferir sintaxe
        run: |
          node --check app.mjs
          node --check calc.mjs
          node --check sw.js
